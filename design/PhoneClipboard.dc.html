<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机 · 剪贴板历史</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 412px; height: 915px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif; color: #16181C; overflow: hidden">
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 16px; background: #F6F7F9">
    <div style="align-self: flex-start; max-width: 260px; padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: #FFFFFF; font-size: 16px; line-height: 1.5; box-shadow: 0 1px 0 rgba(22,24,28,0.08)">把地址发我一下</div>
    <div style="min-height: 48px; box-sizing: border-box; padding: 12px 16px; border-radius: 24px; background: #FFFFFF; border: 1px solid #D3D7DE; display: flex; align-items: center"><span style="display: inline-block; width: 2px; height: 20px; background: #3451C7"></span></div>
  </div>
  <div style="flex: 0 0 380px; display: flex; flex-direction: column; background: #EEF0F3; border-top: 1px solid #D3D7DE">
    <div style="height: 52px; box-sizing: border-box; padding: 4px 8px; display: flex; align-items: center; gap: 4px">
      <button type="button" aria-label="返回键盘" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #16181C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <div role="tablist" aria-label="剪贴板分类" style="flex: 1; display: flex; gap: 4px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: {{t.weight}}">{{t.label}}</button>
        </sc-for>
      </div>
      <button type="button" aria-label="搜索剪贴板" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #16181C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    </div>
    <div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 4px 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 92px; gap: 8px; overflow: hidden">
      <sc-for list="{{items}}" as="c" hint-placeholder-count="6">
        <button type="button" style="box-sizing: border-box; padding: 10px 12px; border: 0; border-radius: 14px; background: #FFFFFF; color: #16181C; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-family: inherit; text-align: left; overflow: hidden">
          <span style="width: 100%; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5A6070">
            <sc-if value="{{c.hasTag}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 6px; border-radius: 8px; background: {{c.tagBg}}; color: {{c.tagFg}}; font-weight: 700">{{c.tag}}</span></sc-if>
            <span style="flex: 1">{{c.time}}</span>
            <sc-if value="{{c.pinned}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="#3451C7" aria-label="已固定" role="img"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"/></svg></sc-if>
          </span>
          <span lang="{{c.lang}}" style="font-size: {{c.fs}}px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{c.text}}</span>
        </button>
      </sc-for>
    </div>
    <div style="height: 44px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5A6070">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span style="flex: 1">仅存于本机并加密 · 保留 7 天 · 密码与敏感内容不记录</span>
      <button type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 18px; background: transparent; color: #3451C7; font-family: inherit; font-size: 13px">管理</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all' };
  }
  renderVals() {
    const all = [
      { text: '东京都豊島区南池袋 1-28-1', time: '1 分钟前', lang: 'ja', tag: '地址', tagBg: '#E4E6EA', tagFg: '#3A3F4A' },
      { text: '482913', time: '3 分钟前 · 短信', fs: 22, tag: '验证码', tagBg: '#E3E8FF', tagFg: '#1F3596', code: true },
      { text: '我的邮箱：name@example.com', time: '快捷短语', pinned: true, tag: '短语', tagBg: '#F6DCC4', tagFg: '#7A3E0B' },
      { text: 'https://example.com/form/2026', time: '昨天', tag: '链接', tagBg: '#E4E6EA', tagFg: '#3A3F4A' },
      { text: '明天上午十点在池袋站东口见，带上在留卡和护照复印件。', time: '昨天', pinned: true },
      { text: 'The meeting has been moved to Friday afternoon.', time: '2 天前', lang: 'en' },
    ];
    const tab = this.state.tab;
    const items = all
      .filter((c) => tab === 'all' || (tab === 'pinned' && c.pinned) || (tab === 'codes' && c.code))
      .map((c) => ({ fs: 15, lang: 'zh-CN', pinned: false, hasTag: !!c.tag, ...c }));
    const tabs = [['all', '全部'], ['pinned', '固定与短语'], ['codes', '验证码']].map(([id, label]) => ({
      label,
      sel: id === tab ? 'true' : 'false',
      bg: id === tab ? '#FFFFFF' : 'transparent',
      fg: id === tab ? '#1F3596' : '#16181C',
      weight: id === tab ? 500 : 400,
      pick: () => this.setState({ tab: id }),
    }));
    return { tabs, items };
  }
}
</script>
</body>
</html>
