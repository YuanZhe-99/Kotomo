<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机 · 日文变形与敬语</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 412px; height: 915px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif; color: #16181C; overflow: hidden">
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 16px; background: #F6F7F9">
    <div lang="ja" style="align-self: flex-start; max-width: 260px; padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: #FFFFFF; font-family: 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.5; box-shadow: 0 1px 0 rgba(22,24,28,0.08)">明日の説明会、来られますか？</div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div lang="ja" style="flex: 1; min-height: 48px; box-sizing: border-box; padding: 12px 16px; border-radius: 24px; background: #FFFFFF; border: 1px solid #D3D7DE; font-family: 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.5; display: flex; align-items: center">
        <span>はい、</span><span style="background: #E3E8FF; color: #1F3596; border-radius: 4px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px">{{chosen}}</span>
      </div>
      <button type="button" aria-label="发送" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: #3451C7; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"/></svg></button>
    </div>
  </div>
  <div style="flex: 0 0 336px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; padding: 10px 12px 12px; background: #EEF0F3; border-top: 1px solid #D3D7DE">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px">
        <span lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 22px; font-weight: 700">行く</span>
        <span lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: #5A6070">いく</span>
        <span style="font-size: 12px; color: #5A6070">动词 · 五段 · 去</span>
      </div>
      <button type="button" aria-label="关闭变形面板" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #16181C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div role="tablist" aria-label="礼貌程度" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 22px; background: #DCE0E6">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="height: 38px; border: 0; border-radius: 19px; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: {{t.weight}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 64px; gap: 6px; align-content: start">
      <sc-for list="{{forms}}" as="f" hint-placeholder-count="6">
        <button type="button" onClick="{{f.pick}}" style="border: 0; border-radius: 12px; background: {{f.bg}}; color: {{f.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 4px; font-family: inherit">
          <span lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 17px; font-weight: 500">{{f.text}}</span>
          <span style="font-size: 11px; color: {{f.sub}}">{{f.label}}</span>
        </button>
      </sc-for>
    </div>
    <div style="font-size: 12px; color: #5A6070">上下滑动切换形式，左右滑动切换礼貌程度；点选即替换当前候选</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'humble', chosen: '伺います' };
  }
  renderVals() {
    const sets = {
      plain: { label: '普通', forms: [['行く', '原形'], ['行かない', 'ない形'], ['行った', 'た形'], ['行って', 'て形'], ['行ける', '可能形'], ['行こう', '意向形'], ['行け', '命令形'], ['行かれる', '被动形'], ['行かせる', '使役形']] },
      polite: { label: '丁寧', forms: [['行きます', 'ます形'], ['行きません', '否定'], ['行きました', '过去'], ['行きましょう', '劝诱'], ['行けます', '可能'], ['行きませんでした', '过去否定']] },
      honor: { label: '尊敬', forms: [['いらっしゃる', '尊敬语'], ['いらっしゃいます', '尊敬 · 丁寧'], ['おいでになる', '尊敬语'], ['行かれる', '尊敬语']] },
      humble: { label: '謙譲', forms: [['参る', '谦让语'], ['参ります', '谦让 · 丁寧'], ['伺う', '拜访'], ['伺います', '拜访 · 丁寧']] },
    };
    const order = ['plain', 'polite', 'honor', 'humble'];
    const tab = this.state.tab;
    const tabs = order.map((id) => ({
      label: sets[id].label,
      selected: id === tab ? 'true' : 'false',
      bg: id === tab ? '#FFFFFF' : 'transparent',
      fg: id === tab ? '#1F3596' : '#16181C',
      weight: id === tab ? 500 : 400,
      pick: () => this.setState({ tab: id }),
    }));
    const forms = sets[tab].forms.map(([text, label]) => {
      const on = text === this.state.chosen;
      return { text, label, bg: on ? '#E3E8FF' : '#FFFFFF', fg: on ? '#1F3596' : '#16181C', sub: on ? '#1F3596' : '#5A6070', pick: () => this.setState({ chosen: text }) };
    });
    return { tabs, forms, chosen: this.state.chosen };
  }
}
</script>
</body>
</html>
