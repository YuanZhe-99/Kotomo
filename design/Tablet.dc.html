<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>平板 · 横屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif; color: #16181C; overflow: hidden">
  <div style="flex: 1 1 auto; display: flex; background: #F6F7F9">
    <div style="flex: 0 0 320px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid #E4E7EC">
      <div style="font-size: 13px; color: #5A6070">文稿</div>
      <div style="padding: 12px 14px; border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 500">留学准备笔记</div>
      <div style="padding: 12px 14px; border-radius: 12px; font-size: 15px; color: #3A3F4A">课程表</div>
    </div>
    <div style="flex: 1; box-sizing: border-box; padding: 28px 40px; display: flex; flex-direction: column; gap: 14px">
      <div style="font-size: 24px; font-weight: 700">留学准备笔记</div>
      <div style="font-size: 16px; line-height: 1.8; color: #3A3F4A">入境后十四天内去区役所登记住址。</div>
      <div lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 17px; line-height: 1.8">住所の届け出には<span style="text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: #3451C7">在留カードとパスポート</span><span style="display: inline-block; width: 2px; height: 20px; margin-left: 1px; vertical-align: -4px; background: #3451C7"></span></div>
    </div>
  </div>
  <div style="flex: 0 0 auto; background: #EEF0F3; border-top: 1px solid #D3D7DE">
    <div style="height: 40px; box-sizing: border-box; padding: 6px 64px 0; display: flex; align-items: center; gap: 6px">
      <button type="button" style="height: 30px; padding: 0 10px 0 4px; border: 0; border-radius: 15px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: inherit; color: #16181C"><span style="height: 22px; min-width: 22px; padding: 0 4px; box-sizing: border-box; border-radius: 11px; background: #F6DCC4; color: #7A3E0B; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">拼</span><span lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 15px">在留</span><span style="font-size: 11px; color: #5A6070">zailiu</span></button>
      <button type="button" style="height: 30px; padding: 0 10px 0 4px; border: 0; border-radius: 15px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: inherit; color: #16181C"><span style="height: 22px; min-width: 22px; padding: 0 4px; box-sizing: border-box; border-radius: 11px; background: #E4E6EA; color: #3A3F4A; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">英</span><span lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 15px">カード</span><span style="font-size: 11px; color: #5A6070">card</span></button>
      <button type="button" style="height: 30px; padding: 0 10px 0 4px; border: 0; border-radius: 15px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: inherit; color: #16181C"><span style="height: 22px; min-width: 22px; padding: 0 4px; box-sizing: border-box; border-radius: 11px; background: #DCE4FF; color: #1F3596; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">罗</span><span lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 15px">と</span><span style="font-size: 11px; color: #5A6070">to</span></button>
      <button type="button" style="height: 30px; padding: 0 10px 0 4px; border: 0; border-radius: 15px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: inherit; color: #16181C"><span style="height: 22px; min-width: 22px; padding: 0 4px; box-sizing: border-box; border-radius: 11px; background: #E4E6EA; color: #3A3F4A; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">英</span><span lang="ja" style="font-family: 'Noto Sans JP', sans-serif; font-size: 15px">パスポート</span><span style="font-size: 11px; color: #5A6070">passport</span></button>
    </div>
    <div style="height: 48px; box-sizing: border-box; padding: 4px 56px 4px 64px; display: flex; align-items: center; gap: 4px">
      <div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow: hidden">
        <button type="button" lang="ja" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: #E3E8FF; color: #1F3596; font-family: 'Noto Sans JP', sans-serif; font-size: 18px; font-weight: 500">在留カードとパスポート</button>
        <button type="button" lang="ja" style="flex: 0 0 auto; height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: #16181C; font-family: 'Noto Sans JP', sans-serif; font-size: 18px">在留カードとpassport</button>
        <button type="button" style="flex: 0 0 auto; height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: #16181C; font-family: inherit; font-size: 18px">在留card和passport</button>
        <button type="button" style="flex: 0 0 auto; height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: #5A6070; font-family: inherit; font-size: 15px">原文 zailiucardtopassport</button>
      </div>
      <button type="button" aria-label="展开全部候选" style="flex: 0 0 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #16181C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <dc-import name="Keyboard" w="{{ 1280 }}" key-h="{{ 50 }}" mode="mix" split="{{ true }}" half="{{ 268 }}" side="{{ 64 }}" hint-size="1280px,238px"></dc-import>
    <div style="height: 40px; box-sizing: border-box; padding: 0 54px; display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="切换输入法" style="width: 44px; height: 40px; border: 0; background: transparent; color: #5A6070; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
      <button type="button" aria-label="收起键盘" style="width: 44px; height: 40px; border: 0; background: transparent; color: #5A6070; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
