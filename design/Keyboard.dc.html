<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Kotomo 键盘按键区</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; box-sizing: border-box; padding: 6px {{side}}px 8px; display: flex; flex-direction: column; gap: 8px; font-family: 'Noto Sans SC', 'Noto Sans JP', system-ui, sans-serif; color: #16181C; background: {{bg}}">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
<div style="display: flex">
<sc-for list="{{row.parts}}" as="p" hint-placeholder-count="1">
<div style="display: flex; gap: 6px; min-width: 0; box-sizing: border-box; {{p.css}}">
<sc-for list="{{p.keys}}" as="k" hint-placeholder-count="10">
<sc-if value="{{k.isFill}}" hint-placeholder-val="{{ false }}">
<div style="flex: {{k.flexCss}}"></div>
</sc-if>
<sc-if value="{{k.isKey}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{k.aria}}" style="flex: {{k.flexCss}}; min-width: 0; height: {{k.h}}px; border: 0; border-radius: 12px; background: {{k.bg}}; color: {{k.fg}}; font-family: inherit; font-size: {{k.fs}}px; font-weight: 400; position: relative; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 1px 0 rgba(22,24,28,0.14)">
<sc-if value="{{k.isText}}" hint-placeholder-val="{{ true }}"><span>{{k.label}}</span></sc-if>
<sc-if value="{{k.isShift}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 4 12h4.5v7h7v-7H20z"/></svg></sc-if>
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"/><path d="m12 9 5 6M17 9l-5 6"/></svg></sc-if>
<sc-if value="{{k.isEnter}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M19 5v7a3 3 0 0 1-3 3H6"/><path d="m9 11-4 4 4 4"/></svg></sc-if>
<sc-if value="{{k.isEmoji}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9.2 9.8h.01M14.8 9.8h.01" stroke-width="2.6"/></svg></sc-if>
<sc-if value="{{k.hasHint}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 3px; right: 5px; font-size: 10px; line-height: 1; color: #5A6070">{{k.hint}}</span></sc-if>
</button>
</sc-if>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":412,"min":280,"max":1400},"keyH":{"editor":"int","default":52,"min":36,"max":90},"mode":{"editor":"enum","default":"mix","options":["mix","zh","ja","en"]},"split":{"editor":"boolean","default":false},"gap":{"editor":"int","default":240,"min":0,"max":480},"hints":{"editor":"boolean","default":true},"half":{"editor":"int","default":0,"min":0,"max":600},"side":{"editor":"int","default":4,"min":0,"max":120},"bg":{"editor":"color","default":"transparent"},"$preview":{"width":412,"height":248}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 412);
    const keyH = Number(this.props.keyH ?? 52);
    const mode = this.props.mode ?? 'mix';
    const split = this.props.split === true || this.props.split === 'true';
    const hints = !(this.props.hints === false || this.props.hints === 'false');
    const side = Number(this.props.side ?? 4);
    const halfProp = Number(this.props.half ?? 0);
    const G = halfProp > 0 ? Math.max(0, w - side * 2 - halfProp * 2) : Number(this.props.gap ?? 240);
    const KEY = '#FFFFFF', FN = '#DCE0E6', ACC = '#3451C7';
    const space = { zh: '拼音', ja: '日本語', mix: '混合 · 中英日', en: 'English' }[mode] || '混合 · 中英日';
    const lang = { zh: '中', ja: '日', mix: '混', en: 'EN' }[mode] || '混';
    const comma = mode === 'en' ? ',' : (mode === 'ja' ? '、' : '，');
    const period = mode === 'en' ? '.' : '。';
    const ch = (c, hint) => ({ kind: 'text', label: c, hint: hint || '', flex: 1, bg: KEY, fg: '#16181C', fs: 21, aria: c });
    const fn = (kind, label, flex, aria) => ({ kind, label: label || '', flex, bg: kind === 'enter' ? ACC : FN, fg: kind === 'enter' ? '#FFFFFF' : '#16181C', fs: 15, aria });
    const fill = (f) => ({ kind: 'fill', flex: f });
    const letters = (s, hs) => s.split('').map((c) => ch(c, hints ? hs[c] : ''));
    const H = { q: '1', w: '2', e: '3', r: '4', t: '5', y: '6', u: '7', i: '8', o: '9', p: '0', a: '@', s: '#', d: '$', f: '%', g: '&', h: '-', j: '+', k: '(', l: ')', z: '*', x: '"', c: '\'', v: ':', b: ';', n: '!', m: '?' };
    const shift = () => fn('shift', '', 1.5, 'Shift');
    const back = () => fn('back', '', 1.5, '删除');
    const emoji = () => ({ ...fn('emoji', '', 1, 'Emoji，长按切换语言'), hint: lang });
    const spaceKey = () => ({ kind: 'text', label: space, flex: 1, bg: KEY, fg: '#5A6070', fs: 13, aria: '空格' });
    const inner = w - side * 2;
    const flexCss = (k) => (k.px ? `0 0 ${k.px}px` : `${k.flex} 1 0`);
    let rows;
    if (split) {
      const half = (inner - G) / 2;
      const u3 = (half - 4 * 6) / 5.5;
      const L = 'flex: 0 0 ' + half + 'px';
      const kpad = Math.round(((half - 4 * 6) / 5) * 0.35);
      rows = [
        { parts: [{ keys: letters('qwert', H), css: L }, { keys: [], css: 'flex: 0 0 ' + G + 'px' }, { keys: letters('yuiop', H), css: L }] },
        { parts: [{ keys: letters('asdfg', H), css: L + '; padding-left: ' + kpad + 'px' }, { keys: [], css: 'flex: 0 0 ' + G + 'px' }, { keys: letters('ghjkl', H), css: L + '; padding-right: ' + kpad + 'px' }] },
        { parts: [{ keys: [shift(), ...letters('zxcv', H)], css: L }, { keys: [], css: 'flex: 0 0 ' + G + 'px' }, { keys: [...letters('vbnm', H), back()], css: L }] },
        { parts: [{ keys: [
          { ...fn('text', '?123', 0, '符号'), px: 1.5 * u3 },
          { ...ch(comma), bg: FN, px: u3 },
          { ...emoji(), bg: KEY, px: u3 },
          spaceKey(),
          { ...ch(period), bg: FN, px: u3 },
          { ...fn('enter', '', 0, '换行'), px: 1.5 * u3 },
        ], css: 'flex: 1 1 0' }] },
      ];
    } else {
      const keyW = (inner - 9 * 6) / 10;
      const pad = Math.round(keyW / 2);
      rows = [
        { parts: [{ keys: letters('qwertyuiop', H), css: 'flex: 1 1 0' }] },
        { parts: [{ keys: letters('asdfghjkl', H), css: 'flex: 1 1 0; padding-inline: ' + pad + 'px' }] },
        { parts: [{ keys: [shift(), ...letters('zxcvbnm', H), back()], css: 'flex: 1 1 0' }] },
        { parts: [{ keys: [fn('text', '?123', 1.4, '符号'), ch(comma), emoji(), { ...spaceKey(), flex: 4.6 }, ch(period), fn('enter', '', 1.5, '换行')], css: 'flex: 1 1 0' }] },
      ];
    }
    rows = rows.map((r) => ({
      parts: r.parts.map((p) => ({
        css: p.css,
        keys: p.keys.map((k) => ({
          ...k,
          flexCss: flexCss(k),
          isFill: k.kind === 'fill',
          isKey: k.kind !== 'fill',
          isText: k.kind === 'text',
          isShift: k.kind === 'shift',
          isBack: k.kind === 'back',
          isEnter: k.kind === 'enter',
          isEmoji: k.kind === 'emoji',
          hasHint: !!k.hint,
          h: keyH,
        })),
      })),
    }));
    return { w, side, rows, bg: this.props.bg ?? 'transparent' };
  }
}
</script>
</body>
</html>
