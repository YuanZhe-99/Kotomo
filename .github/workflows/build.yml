name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      # Every submodule the app build compiles; Mozc is built by mozc.yml and stays out of this job.
      - name: Check out engine submodules
        run: >
          git submodule update --init --depth 1
          third_party/heliboard third_party/librime third_party/leveldb third_party/marisa-trie
          third_party/yaml-cpp third_party/opencc third_party/rime-luna-pinyin third_party/rime-prelude
          third_party/rime-essay third_party/rime-stroke

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check documentation
        run: java tool/CheckDocs.java

      - name: Fetch Boost headers (librime)
        run: scripts/fetch-boost.sh

      # Mozc's Android libraries come from mozc.yml, pinned by run and hash in build-lock.json.
      - name: Fetch prebuilt Mozc
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-mozc.sh

      # The app ships compiled Chinese data, so the phone never compiles it on first use.
      - name: Prebuild Chinese data (librime on the host)
        run: |
          sudo apt-get install -y ninja-build > /dev/null
          scripts/prebuild-rime.sh

      # The Rime data staging runs the SDK's CMake before the native build would install it.
      - name: Install CMake and the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;30.0.16248370" > /dev/null

      # Pull requests from forks get no secrets; their release APK stays unsigned.
      - name: Setup release signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kotomo.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/kotomo.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties

      # AGP downloads the platform and build tools named in app/build.gradle.kts.
      - name: Build and check
        env:
          KOTOMO_REQUIRE_RIME_PREBUILT: "1"
          KOTOMO_REQUIRE_MOZC: "1"
        run: ./gradlew --no-daemon check assembleDebug assembleRelease

      - name: Verify release signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            echo "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          done

      # One artifact per ABI, so the phone build downloads without the emulator one.
      - uses: actions/upload-artifact@v7
        with:
          name: kotomo-arm64-v8a
          path: app/build/outputs/apk/*/app-arm64-v8a-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: kotomo-x86_64
          path: app/build/outputs/apk/*/app-x86_64-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kotomo-*
          path: artifacts

      - name: Name the release APK
        run: |
          mkdir -p release
          for abi in arm64-v8a x86_64; do
            cp "artifacts/kotomo-$abi/release/app-$abi-release.apk" "release/Kotomo-${GITHUB_REF_NAME}-$abi.apk"
          done

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
