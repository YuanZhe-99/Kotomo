# Gradle and the workflow actions only. The upstream engines are submodules pinned to release
# commits and moved by hand with their patches and the corpus (AGENTS.md, Upstream versions);
# dependabot's submodule updates follow branch tips, so they are not enabled.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
