# Kotomo: the dictionaries Kotomo's settings manage; kotomo_packs_bin compiles in background `:deploy` when present.
#
# Three plain-text tables in the user directory, one translator each, from most to least trusted:
#   custom_phrase.txt      entries the person added by hand (luna_pinyin's own custom_phrase, quality 1)
#   kotomo_packs.txt       small downloaded dictionaries, hash-checked against the catalog (quality 0)
#   kotomo_packs_bin.*     large downloaded dictionaries (e.g. rime-ice base/ext), joined into
#                          kotomo_packs_bin.dict.yaml and compiled into kotomo_packs_bin.table.bin in
#                          background `:deploy` as a translator pack (quality 1 via script_translator)
#   kotomo_low.txt         imported files and LLM-generated entries, validated but untrusted (quality -1)
# Plain tables hold `word<TAB>code<TAB>weight` with toneless pinyin without spaces and reload on
# schema selection; kotomo_packs_bin.dict.yaml uses space-separated pinyin and reloads after `:deploy`.
# luna_pinyin_simp_private applies the same patch, so sensitive fields see the same words (these
# tables are read-only; nothing is learned into them).
#
# Fuzzy pinyin (PLAN §9.6) and neighbouring-key correction (ADR-016): kotomo_fuzzy.yaml. The one
# in the shared data (core/rime/data/kotomo_fuzzy.yaml) is the default state, prebuilt for the APK:
# no rule, correction on. The app writes its own into the user directory from the switches
# chinese.fuzzy.*, chinese.double_pinyin and chinese.key_correction (app/.../ime/Fuzzy.kt) when
# they differ from that, and deploys in its deploy process.
patch:
  __include: kotomo_fuzzy:/patch?
  engine/translators:
    - punct_translator
    - table_translator@custom_phrase
    - table_translator@kotomo_packs
    - table_translator@kotomo_low
    - reverse_lookup_translator
    - script_translator
  kotomo_packs:
    dictionary: ""
    user_dict: kotomo_packs
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 0
  kotomo_low:
    dictionary: ""
    user_dict: kotomo_low
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: -1
  # Compiled downloadable dictionary packs (optional; ignored cleanly unless kotomo_packs_bin.table.bin exists).
  translator/packs:
    - kotomo_packs_bin
  # Each candidate's spelling as its comment, for the candidate details (long press on a candidate);
  # librime hides a spelling equal to the preedit unless always_show_comments is set.
  translator/spelling_hints: 8
  translator/always_show_comments: true
  # Taiwan and Hong Kong output with regional phrases (軟件 -> 軟體 in Taiwan): Kotomo's OpenCC
  # configs (core/rime/data) chain the regional phrase tables before the variant tables.
  zh_hant_tw/opencc_config: t2twp.json
  zh_hant_hk/opencc_config: t2hkp.json
